name: Sync upstream

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Merge upstream
        id: merge
        run: |
          git remote add upstream https://github.com/shuaiplus/nodewarden.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit upstream/main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Install and verify
        if: steps.merge.outputs.changed == 'true'
        run: |
          npm ci
          npm run build
          npm run test:base-path
          npm run test:config-compatibility
          npm run test:vault-compatibility
          npm run test:web-crypto
          npm run test:notifications-security
          npm run test:webauthn-connectors
      - name: Push verified merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main
